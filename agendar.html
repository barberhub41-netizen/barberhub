<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agendar — BarberHub</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#d86b3f" />
<link rel="apple-touch-icon" href="icone-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="estilo.css" />
</head>
<body>

<header class="top" id="topo"></header>

<main class="pagina">
  <div class="wrap" id="conteudo">
    <p class="carregando">Carregando...</p>
  </div>
</main>

<template id="modelo">
  <a class="voltar" id="voltar" style="text-align:left;margin:0 0 20px">← Voltar para o perfil</a>
  <h1 id="titulo">Agendar</h1>
  <p class="legenda" id="legenda"></p>

  <div class="painel" style="max-width:760px;margin-top:28px">
    <div class="campo" style="margin-top:0">
      <label>1. Serviços</label>
      <div id="servico" class="escolhas"></div>
      <p class="dica" id="total-servicos">Marque um ou mais. O tempo e o valor somam.</p>
    </div>

    <div class="campo">
      <label for="profissional">2. Profissional</label>
      <select id="profissional"></select>
    </div>

    <div class="campo">
      <label for="data">3. Dia</label>
      <input id="data" type="date" />
    </div>

    <div class="campo">
      <label>4. Horário</label>
      <div id="horarios"><p class="carregando" style="padding:20px 0">Escolha um dia.</p></div>
    </div>

    <div class="campo">
      <label for="cupom">5. Cupom de desconto</label>
      <div class="linha-form" style="grid-template-columns:1fr auto">
        <input id="cupom" type="text" placeholder="Tem um código? Digite aqui" style="text-transform:uppercase" />
        <button class="btn btn-outline" type="button" id="aplicar-cupom">Aplicar</button>
      </div>
      <div class="aviso" id="cupom-aviso" role="status"></div>
    </div>

    <div class="aviso" id="aviso" role="status"></div>

    <div class="acoes">
      <button class="btn btn-solid" id="confirmar" disabled>Confirmar agendamento</button>
    </div>
  </div>
</template>

<script type="module">
import { sb, montarTopo, sessaoAtual, moeda, duracao, escapar,
         assinaturaDoCliente, aplicarPlano } from './app.js';

montarTopo('buscar');

const conteudo = document.getElementById('conteudo');
const slug = new URLSearchParams(location.search).get('slug');
const DIAS_A_FRENTE = 60;

function erro(msg) {
  conteudo.innerHTML = '<div class="vazio" style="margin-top:60px"><b>Não deu para abrir a agenda</b>' +
    '<p>' + msg + '</p><a class="btn btn-solid" href="buscar.html">Ver barbearias</a></div>';
}

if (!slug) {
  erro('O endereço não traz o identificador da barbearia.');
} else {
  const { data: b } = await sb.from('estabelecimentos')
    .select('id, nome, slug, cidade, intervalo_min').eq('slug', slug).maybeSingle();

  if (!b) {
    erro('Essa barbearia não está mais no catálogo.');
  } else {
    const [servicos, equipe, ajustes] = await Promise.all([
      sb.from('servicos').select('id, nome, preco_centavos, duracao_min')
        .eq('estabelecimento_id', b.id).eq('ativo', true).order('nome'),
      sb.from('barbeiros').select('id, nome')
        .eq('estabelecimento_id', b.id).eq('ativo', true).order('nome'),
      sb.from('barbeiro_servicos').select('barbeiro_id, servico_id, duracao_min, atende')
    ]);

    if (!servicos.data?.length || !equipe.data?.length) {
      erro('Esta barbearia ainda não cadastrou serviços ou equipe.');
    } else {
      const sessao = await sessaoAtual();
      const assinatura = sessao
        ? await assinaturaDoCliente(sessao.user.id, b.id)
        : null;

      conteudo.innerHTML = '';
      conteudo.appendChild(document.getElementById('modelo').content.cloneNode(true));
      iniciar(b, servicos.data, equipe.data, assinatura, ajustes.data || []);
    }
  }
}

function iniciar(barbearia, servicos, equipe, assinatura, ajustes) {
  const elServico = document.getElementById('servico');
  const elProf    = document.getElementById('profissional');
  const elData    = document.getElementById('data');
  const elHoras   = document.getElementById('horarios');
  const aviso     = document.getElementById('aviso');
  const confirmar = document.getElementById('confirmar');

  document.title = 'Agendar — ' + barbearia.nome;
  document.getElementById('titulo').textContent = barbearia.nome;
  document.getElementById('legenda').textContent = 'Escolha o serviço, o profissional e o horário.';
  document.getElementById('voltar').href = 'barbearia.html?slug=' + encodeURIComponent(barbearia.slug);

  let escolhido = null;   // Date do horário selecionado
  let cupom = null;       // cupom conferido e aceito
  const PASSO = barbearia.intervalo_min || 30;   // definido pela barbearia

  const mostrar = (t, tipo = 'erro') => { aviso.textContent = t; aviso.className = 'aviso ' + tipo; };

  // o ajuste daquele profissional naquele serviço, se houver
  function ajusteDe(servicoId, barbeiroId) {
    return ajustes.find(a => a.servico_id === servicoId && a.barbeiro_id === barbeiroId);
  }

  function atende(servicoId, barbeiroId) {
    const a = ajusteDe(servicoId, barbeiroId);
    return a ? a.atende : true;
  }

  // quanto tempo ESSE profissional leva nesse serviço
  function tempoDe(servico, barbeiroId) {
    const a = ajusteDe(servico.id, barbeiroId);
    return a?.duracao_min ?? servico.duracao_min;
  }

  function montarServicos() {
    const barbeiro = elProf.value;
    const marcados = new Set(
      [...elServico.querySelectorAll('input:checked')].map(i => i.value)
    );

    const disponiveis = servicos.filter(s => atende(s.id, barbeiro));

    if (!disponiveis.length) {
      elServico.innerHTML = '<p class="legenda">Esse profissional não atende nenhum serviço cadastrado.</p>';
      return;
    }

    elServico.innerHTML = disponiveis.map(s =>
      '<label class="escolha"><input type="checkbox" value="' + s.id + '"' +
      (marcados.has(s.id) ? ' checked' : '') + ' />' +
      '<span><b>' + escapar(s.nome) + '</b>' +
      '<small>' + duracao(tempoDe(s, barbeiro)) + ' · ' + moeda(s.preco_centavos) + '</small></span></label>').join('');

    // nada marcado ainda? marca o primeiro, para a tela não abrir vazia
    if (!elServico.querySelector('input:checked')) {
      const primeiro = elServico.querySelector('input');
      if (primeiro) primeiro.checked = true;
    }
  }

  function escolhidos() {
    return [...elServico.querySelectorAll('input:checked')]
      .map(i => servicos.find(s => s.id === i.value))
      .filter(Boolean);
  }

  const somaDuracao = () => escolhidos().reduce((t, s) => t + tempoDe(s, elProf.value), 0);
  const somaPreco   = () => escolhidos().reduce((t, s) => t + s.preco_centavos, 0);

  function comPlano() {
    return aplicarPlano(escolhidos(), assinatura);
  }

  function somaCobrada() {
    return comPlano().reduce((t, l) => t + l.preco, 0);
  }

  function atualizarTotal() {
    const lista = escolhidos();
    const alvo = document.getElementById('total-servicos');

    if (!lista.length) {
      alvo.innerHTML = 'Marque pelo menos um serviço.';
      return;
    }

    const linhas = comPlano();
    const cheio = somaPreco();
    const cobrado = Math.max(0, somaCobrada() - (cupom?.desconto || 0));

    let detalhe = '';
    if (assinatura) {
      detalhe = '<div class="resumo-plano">' +
        '<b>' + escapar(assinatura.plano.nome) + '</b>' +
        linhas.map(l =>
          '<div class="linha-preco"><span>' + escapar(l.servico.nome) + '</span>' +
          '<span>' + (l.preco === 0 ? 'incluído' : moeda(l.preco)) +
          (l.motivo ? ' <small>' + escapar(l.motivo) + '</small>' : '') + '</span></div>'
        ).join('') +
        (cobrado < cheio
          ? '<div class="linha-preco economia"><span>Você economiza</span><span>' +
            moeda(cheio - cobrado) + '</span></div>'
          : '') +
        '</div>';
    } else if (cupom) {
      detalhe = '<div class="resumo-plano"><b>Cupom ' + escapar(cupom.codigo) + '</b>' +
        '<div class="linha-preco"><span>Desconto</span><span>− ' + moeda(cupom.desconto) + '</span></div></div>';
    }

    alvo.innerHTML = lista.length + (lista.length === 1 ? ' serviço' : ' serviços') +
      ' · ' + duracao(somaDuracao()) + ' · ' +
      (cobrado < cheio
        ? '<s style="color:var(--dim)">' + moeda(cheio) + '</s> <b style="color:var(--orange-2)">' + moeda(cobrado) + '</b>'
        : moeda(cheio)) +
      detalhe;
  }

  elProf.innerHTML = equipe.map(p =>
    '<option value="' + p.id + '">' + escapar(p.nome) + '</option>').join('');

  // agora que há um profissional selecionado, a lista sai com o tempo dele
  montarServicos();

  // limites do campo de data
  const hoje = new Date();
  const limite = new Date(hoje.getTime() + DIAS_A_FRENTE * 86400000);
  elData.min = iso(hoje);
  elData.max = iso(limite);
  elData.value = iso(hoje);

  function iso(d) {
    return d.getFullYear() + '-' +
      String(d.getMonth() + 1).padStart(2, '0') + '-' +
      String(d.getDate()).padStart(2, '0');
  }

  // retoma a escolha se o cliente foi fazer login no meio do caminho
  const guardado = sessionStorage.getItem('barberhub:agendamento');
  if (guardado) {
    try {
      const g = JSON.parse(guardado);
      if (g.slug === barbearia.slug) {
        if (Array.isArray(g.servicos)) {
          elServico.querySelectorAll('input').forEach(i => {
            i.checked = g.servicos.includes(i.value);
          });
        }
        if (equipe.some(p => p.id === g.profissional)) {
          elProf.value = g.profissional;
          montarServicos();
        }
        if (g.data >= elData.min) elData.value = g.data;
      }
    } catch (e) { /* ignora */ }
    sessionStorage.removeItem('barberhub:agendamento');
  }

  // ------------------------------------------------------------
  // Cálculo dos horários livres
  // ------------------------------------------------------------
  async function calcular() {
    escolhido = null;
    confirmar.disabled = true;
    elHoras.innerHTML = '<p class="carregando" style="padding:20px 0">Procurando horários...</p>';

    const dia = elData.value;
    const minutosTotal = somaDuracao();
    atualizarTotal();
    if (!minutosTotal || !dia) {
      elHoras.innerHTML = '<p class="legenda" style="padding:14px 0">Marque ao menos um serviço.</p>';
      return;
    }

    const inicioDia = new Date(dia + 'T00:00:00');
    const fimDia    = new Date(dia + 'T23:59:59');
    const diaSemana = inicioDia.getDay();

    const [jornadas, ocupados, bloqueios] = await Promise.all([
      sb.from('jornadas').select('hora_inicio, hora_fim')
        .eq('barbeiro_id', elProf.value).eq('dia_semana', diaSemana)
        .order('hora_inicio'),
      sb.from('agendamentos').select('inicio, fim')
        .eq('barbeiro_id', elProf.value)
        .in('status', ['pendente', 'confirmado'])
        .gte('inicio', inicioDia.toISOString())
        .lte('inicio', fimDia.toISOString()),
      sb.from('bloqueios').select('barbeiro_id, dia_semana, hora_inicio, hora_fim, inicio, fim')
        .eq('estabelecimento_id', barbearia.id)
    ]);

    if (!jornadas.data?.length) {
      elHoras.innerHTML = '<p class="legenda" style="padding:14px 0">' +
        'Esse profissional não atende nesse dia. Tente outra data.</p>';
      return;
    }

    const marcados = (ocupados.data || []).map(a => [new Date(a.inicio), new Date(a.fim)]);

    // bloqueios do dia: almoço, pausa, folga, feriado
    (bloqueios.data || []).forEach(b => {
      if (b.barbeiro_id && b.barbeiro_id !== elProf.value) return;   // é de outro profissional
      if (b.dia_semana !== null && b.dia_semana !== undefined) {
        if (b.dia_semana !== diaSemana) return;
        marcados.push([
          new Date(dia + 'T' + String(b.hora_inicio).slice(0, 8)),
          new Date(dia + 'T' + String(b.hora_fim).slice(0, 8))
        ]);
      } else {
        marcados.push([new Date(b.inicio), new Date(b.fim)]);
      }
    });
    const agora = new Date();
    const vagas = [];

    for (const j of jornadas.data) {
      const abre  = new Date(dia + 'T' + String(j.hora_inicio).slice(0, 8));
      const fecha = new Date(dia + 'T' + String(j.hora_fim).slice(0, 8));

      for (let t = new Date(abre); t < fecha; t = new Date(t.getTime() + PASSO * 60000)) {
        const termina = new Date(t.getTime() + minutosTotal * 60000);
        if (termina > fecha) break;            // não cabe antes de fechar
        if (t <= agora) continue;              // horário já passou
        const conflita = marcados.some(([i, f]) => t < f && termina > i);
        if (!conflita) vagas.push(new Date(t));
      }
    }

    if (!vagas.length) {
      elHoras.innerHTML = '<p class="legenda" style="padding:14px 0">' +
        'Nenhum horário livre nesse dia para esse serviço. Tente outra data ou outro profissional.</p>';
      return;
    }

    elHoras.innerHTML = '<div class="chips" style="justify-content:flex-start;margin-top:4px">' +
      vagas.map(v => '<button type="button" class="chip" data-hora="' + v.toISOString() + '">' +
        String(v.getHours()).padStart(2, '0') + ':' +
        String(v.getMinutes()).padStart(2, '0') + '</button>').join('') + '</div>';
  }

  elHoras.addEventListener('click', (e) => {
    const botao = e.target.closest('[data-hora]');
    if (!botao) return;
    elHoras.querySelectorAll('.chip').forEach(c => c.style.borderColor = '');
    botao.style.borderColor = 'var(--orange)';
    botao.style.color = 'var(--orange)';
    escolhido = new Date(botao.dataset.hora);
    confirmar.disabled = false;
    aviso.className = 'aviso';
  });

  // ------------------------------------------------------------
  // Cupom
  // ------------------------------------------------------------
  const avisoCupom = document.getElementById('cupom-aviso');
  const campoCupom = document.getElementById('cupom');

  document.getElementById('aplicar-cupom').addEventListener('click', async () => {
    const codigo = campoCupom.value.trim();

    if (!codigo) {
      cupom = null;
      avisoCupom.className = 'aviso';
      atualizarTotal();
      return;
    }

    const sessao = await sessaoAtual();
    if (!sessao) {
      avisoCupom.textContent = 'Entre na sua conta para usar cupom.';
      avisoCupom.className = 'aviso erro';
      return;
    }

    if (!escolhidos().length) {
      avisoCupom.textContent = 'Escolha os serviços antes de aplicar o cupom.';
      avisoCupom.className = 'aviso erro';
      return;
    }

    const { data, error } = await sb.rpc('validar_cupom', {
      p_estab: barbearia.id,
      p_codigo: codigo,
      p_total: somaCobrada()
    });

    if (error) {
      avisoCupom.textContent = 'Não foi possível conferir: ' + error.message;
      avisoCupom.className = 'aviso erro';
      return;
    }

    if (!data.ok) {
      cupom = null;
      avisoCupom.textContent = data.motivo;
      avisoCupom.className = 'aviso erro';
      atualizarTotal();
      return;
    }

    cupom = data;
    avisoCupom.textContent = 'Cupom aplicado: menos ' + moeda(data.desconto) +
      (data.descricao ? ' · ' + data.descricao : '') + '.';
    avisoCupom.className = 'aviso ok';
    atualizarTotal();
  });

  // trocar serviço invalida o desconto já calculado
  elServico.addEventListener('change', () => {
    if (cupom) {
      cupom = null;
      avisoCupom.textContent = 'Os serviços mudaram. Aplique o cupom de novo.';
      avisoCupom.className = 'aviso erro';
    }
  });

  // ------------------------------------------------------------
  // Confirmação
  // ------------------------------------------------------------
  confirmar.addEventListener('click', async () => {
    if (!escolhido) return mostrar('Escolha um horário.');

    const sessao = await sessaoAtual();
    if (!sessao) {
      // guarda a escolha e manda fazer login; volta para cá depois
      sessionStorage.setItem('barberhub:agendamento', JSON.stringify({
        slug: barbearia.slug,
        servicos: escolhidos().map(s => s.id),
        profissional: elProf.value,
        data: elData.value
      }));
      const volta = 'agendar.html?slug=' + encodeURIComponent(barbearia.slug);
      location.href = 'entrar.html?voltar=' + encodeURIComponent(volta);
      return;
    }

    const lista = escolhidos();
    if (!lista.length) return mostrar('Marque pelo menos um serviço.');

    const fim = new Date(escolhido.getTime() + somaDuracao() * 60000);

    confirmar.disabled = true;
    confirmar.textContent = 'Confirmando...';

    const { data: criado, error } = await sb.from('agendamentos').insert({
      estabelecimento_id: barbearia.id,
      barbeiro_id: elProf.value,
      servico_id: lista[0].id,
      cliente_id: sessao.user.id,
      inicio: escolhido.toISOString(),
      fim: fim.toISOString(),
      valor_centavos: Math.max(0, somaCobrada() - (cupom?.desconto || 0)),
      assinatura_id: assinatura ? assinatura.id : null,
      cupom_id: cupom ? cupom.cupom_id : null,
      desconto_cupom_centavos: cupom ? cupom.desconto : 0
    }).select('id').single();

    confirmar.textContent = 'Confirmar agendamento';

    if (!error) {
      // grava os itens com nome, preço e duração do momento da marcação
      const linhas = comPlano();
      const itens = await sb.from('agendamento_servicos').insert(
        linhas.map((l, i) => ({
          agendamento_id: criado.id,
          servico_id: l.servico.id,
          nome: l.servico.nome,
          preco_centavos: l.servico.preco_centavos,
          preco_cobrado_centavos: l.preco,
          coberto: l.coberto,
          desconto_pct: l.desconto,
          duracao_min: tempoDe(l.servico, elProf.value),
          ordem: i
        }))
      );
      if (itens.error) {
        // sem os itens o agendamento fica sem sentido: desfaz
        await sb.from('agendamentos').delete().eq('id', criado.id);
        mostrar('Não foi possível registrar os serviços: ' + itens.error.message);
        confirmar.disabled = false;
        return;
      }

      if (cupom) {
        await sb.from('cupom_usos').insert({
          cupom_id: cupom.cupom_id,
          cliente_id: sessao.user.id,
          agendamento_id: criado.id,
          desconto_centavos: cupom.desconto
        });
      }
    }

    if (error) {
      // a trava do banco devolve erro quando alguém pegou o horário antes
      const ocupado = /conflito|exclusion|overlap/i.test(error.message);
      mostrar(ocupado
        ? 'Esse horário acabou de ser preenchido por outra pessoa. Escolha outro.'
        : 'Não foi possível agendar: ' + error.message);
      calcular();
      return;
    }

    location.href = 'meus-agendamentos.html';
  });

  elServico.addEventListener('change', calcular);
  atualizarTotal();
  elProf.addEventListener('change', () => { montarServicos(); calcular(); });
  elData.addEventListener('change', calcular);
  calcular();
}
</script>

</body>
</html>
