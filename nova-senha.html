<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nova senha — BarberHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="estilo.css" />
</head>
<body>

<header class="top" id="topo"></header>

<main class="acesso">
  <div class="caixa">
    <h1>Nova senha</h1>
    <p class="legenda" id="legenda">Escolha uma senha para voltar a entrar.</p>

    <form id="form" novalidate>
      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="new-password" placeholder="Mínimo de 6 caracteres" minlength="6" required />
      </div>
      <div class="campo">
        <label for="repete">Repita a senha</label>
        <input id="repete" type="password" autocomplete="new-password" placeholder="A mesma senha" required />
      </div>
      <button class="btn btn-solid" type="submit" id="botao">Salvar senha</button>
    </form>

    <div class="aviso" id="aviso" role="status"></div>
    <a class="voltar" href="entrar.html">← Ir para o login</a>
  </div>
</main>

<script type="module">
import { sb, montarTopo } from './app.js';
import { traduzErro } from './config.js';

montarTopo('');

const form  = document.getElementById('form');
const aviso = document.getElementById('aviso');
const botao = document.getElementById('botao');

function dizer(texto, tipo = 'erro') {
  aviso.textContent = texto;
  aviso.className = 'aviso ' + tipo;
}

// O link do e-mail abre esta página já com uma sessão temporária.
// Sem ela, não há o que trocar.
const { data: { session } } = await sb.auth.getSession();

if (!session) {
  form.style.display = 'none';
  document.getElementById('legenda').textContent =
    'Este link não vale mais. Peça outro na tela de recuperação.';
  dizer('O link expira depois de um tempo e só funciona uma vez.', 'erro');
  document.querySelector('.voltar').href = 'recuperar.html';
  document.querySelector('.voltar').textContent = '← Pedir um novo link';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const senha  = document.getElementById('senha').value;
  const repete = document.getElementById('repete').value;

  if (senha.length < 6)  return dizer('A senha precisa ter pelo menos 6 caracteres.');
  if (senha !== repete)  return dizer('As duas senhas não são iguais.');

  botao.disabled = true;
  botao.textContent = 'Salvando...';

  const { error } = await sb.auth.updateUser({ password: senha });

  botao.disabled = false;
  botao.textContent = 'Salvar senha';

  if (error) return dizer(traduzErro(error.message));

  dizer('Senha alterada. Levando você para dentro...', 'ok');
  setTimeout(() => { location.href = 'meus-agendamentos.html'; }, 1200);
});
</script>

</body>
</html>
