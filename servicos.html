<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Serviços — BarberHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="estilo.css" />
</head>
<body>

<header class="top" id="topo"></header>

<main class="pagina">
  <div class="wrap">
    <h1>Serviços</h1>
    <p class="legenda">O que a sua barbearia oferece, com preço e duração.</p>
    <div id="menu"></div>

    <div id="conteudo"><p class="carregando">Carregando...</p></div>
  </div>
</main>

<template id="modelo">
  <div class="painel" style="max-width:860px">
    <form id="novo">
      <div class="linha-form">
        <div class="campo">
          <label for="nome">Serviço</label>
          <input id="nome" type="text" placeholder="Corte + barba" required />
        </div>
        <div class="campo">
          <label for="preco">Preço (R$)</label>
          <input id="preco" type="text" inputmode="decimal" placeholder="70,00" required />
        </div>
        <div class="campo">
          <label for="duracao">Duração (min)</label>
          <input id="duracao" type="number" min="5" max="600" step="5" placeholder="50" required />
        </div>
        <button class="btn btn-solid" type="submit" id="adicionar">Adicionar</button>
      </div>
      <div class="aviso" id="aviso" role="status"></div>
    </form>
  </div>

  <div id="lista" style="margin-top:28px"></div>
</template>

<script type="module">
import { sb, montarTopo, exigirLogin, montarPainel,
         paraCentavos, deCentavos, moeda, duracao, escapar } from './app.js';

const sessao = await exigirLogin();
montarTopo('estabelecimento');
const barbearia = await montarPainel('servicos.html');

const conteudo = document.getElementById('conteudo');

if (!barbearia) {
  conteudo.innerHTML = '<div class="vazio">' +
    '<b>Cadastre a barbearia primeiro</b>' +
    '<p>Os serviços pertencem a um estabelecimento. Preencha os dados antes.</p>' +
    '<a class="btn btn-solid" href="estabelecimento.html">Cadastrar barbearia</a></div>';
} else {
  conteudo.appendChild(document.getElementById('modelo').content.cloneNode(true));
  iniciar();
}

function iniciar() {
  const lista = document.getElementById('lista');
  const aviso = document.getElementById('aviso');
  const botao = document.getElementById('adicionar');

  const mostrar = (t, tipo = 'erro') => { aviso.textContent = t; aviso.className = 'aviso ' + tipo; };

  async function carregar() {
    const { data, error } = await sb
      .from('servicos')
      .select('id, nome, preco_centavos, duracao_min, ativo')
      .eq('estabelecimento_id', barbearia.id)
      .order('nome');

    if (error) { lista.innerHTML = '<div class="vazio"><b>Erro ao carregar</b><p>' + escapar(error.message) + '</p></div>'; return; }

    if (!data.length) {
      lista.innerHTML = '<div class="vazio"><b>Nenhum serviço ainda</b>' +
        '<p>Cadastre pelo menos um para que o cliente possa agendar.</p></div>';
      return;
    }

    lista.innerHTML = data.map(s =>
      '<div class="item' + (s.ativo ? '' : ' inativo') + '">' +
        '<div class="principal"><b>' + escapar(s.nome) + '</b>' +
        '<span>' + moeda(s.preco_centavos) + ' · ' + duracao(s.duracao_min) +
        (s.ativo ? '' : ' · oculto do cliente') + '</span></div>' +
        '<button class="btn btn-outline" data-alternar="' + s.id + '" data-ativo="' + s.ativo + '">' +
          (s.ativo ? 'Ocultar' : 'Mostrar') + '</button>' +
        '<button class="btn btn-perigo" data-apagar="' + s.id + '">Excluir</button>' +
      '</div>'
    ).join('');
  }

  document.getElementById('novo').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nome = document.getElementById('nome').value.trim();
    const centavos = paraCentavos(document.getElementById('preco').value);
    const minutos = Number(document.getElementById('duracao').value);

    if (!nome) return mostrar('Informe o nome do serviço.');
    if (centavos === null) return mostrar('Preço inválido. Use algo como 70,00.');
    if (!minutos || minutos < 5) return mostrar('A duração precisa ser de pelo menos 5 minutos.');

    botao.disabled = true;
    const { error } = await sb.from('servicos').insert({
      estabelecimento_id: barbearia.id,
      nome, preco_centavos: centavos, duracao_min: minutos
    });
    botao.disabled = false;

    if (error) return mostrar('Não foi possível salvar: ' + error.message);

    document.getElementById('novo').reset();
    mostrar('Serviço adicionado.', 'ok');
    carregar();
  });

  lista.addEventListener('click', async (e) => {
    const alternar = e.target.closest('[data-alternar]');
    const apagar   = e.target.closest('[data-apagar]');

    if (alternar) {
      const ativo = alternar.dataset.ativo === 'true';
      alternar.disabled = true;
      await sb.from('servicos').update({ ativo: !ativo }).eq('id', alternar.dataset.alternar);
      carregar();
      return;
    }

    if (apagar) {
      if (!confirm('Excluir esse serviço? Se já houver agendamento com ele, o banco não vai permitir — nesse caso use Ocultar.')) return;
      apagar.disabled = true;
      const { error } = await sb.from('servicos').delete().eq('id', apagar.dataset.apagar);
      if (error) {
        alert('Não foi possível excluir. Provavelmente já existe agendamento usando esse serviço. Use Ocultar.');
        apagar.disabled = false;
        return;
      }
      carregar();
    }
  });

  carregar();
}
</script>

</body>
</html>
