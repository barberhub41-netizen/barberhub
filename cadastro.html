<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Criar conta — BarberHub</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#d86b3f" />
<link rel="apple-touch-icon" href="icone-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="estilo.css" />
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <a class="logo" href="index.html">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.1" y2="15.9"/><line x1="14.5" y1="14.5" x2="20" y2="20"/><line x1="8.1" y1="8.1" x2="12" y2="12"/></svg>
      </span>
      <span><b>Barber<i>Hub</i></b><small>Para todos os estilos</small></span>
    </a>
    <div class="top-cta">
      <a class="btn btn-outline btn-sm" href="entrar.html">Entrar</a>
    </div>
  </div>
</header>

<main class="acesso">
  <div class="caixa">
    <h1>Criar conta</h1>
    <p class="legenda">Conta de cliente, para marcar horário. É de graça.</p>

    <form id="form-cadastro" novalidate>
      <div class="campo">
        <label for="nome">Nome</label>
        <input id="nome" type="text" autocomplete="name" placeholder="Como quer ser chamado" required />
      </div>
      <div class="campo">
        <label for="telefone">Telefone</label>
        <input id="telefone" type="tel" autocomplete="tel" placeholder="(41) 90000-0000" inputmode="tel" />
      </div>
      <div class="campo">
        <label for="cpf">CPF</label>
        <input id="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00" autocomplete="off" required />
        <p class="dica" style="color:var(--dim);font-size:12.5px;margin-top:6px;text-transform:none;letter-spacing:0">
          Uma conta por CPF. Serve para a barbearia saber quem é quem.
        </p>
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="email" placeholder="voce@email.com" required />
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="new-password" placeholder="Mínimo de 6 caracteres" minlength="6" required />
      </div>
      <button class="btn btn-solid" type="submit" id="botao">Criar minha conta</button>
    </form>

    <div class="aviso" id="aviso" role="status"></div>


    <p class="rodape-caixa">Já tem conta? <a href="entrar.html">Entrar</a></p>
    <p class="rodape-caixa" style="margin-top:8px">Tem uma barbearia? <a href="cadastro-estabelecimento.html">Cadastrar estabelecimento</a></p>
    <a class="voltar" href="index.html">← Voltar para o início</a>
  </div>
</main>

<script type="module">
import { sb, traduzErro } from './config.js';
import { mascaraCpf, cpfValido, soDigitos } from './app.js';

const destino = new URLSearchParams(location.search).get('voltar') || 'meus-agendamentos.html';
const form   = document.getElementById('form-cadastro');
const cpf    = document.getElementById('cpf');
mascaraCpf(cpf);
const aviso  = document.getElementById('aviso');
const botao  = document.getElementById('botao');

function mostrar(texto, tipo = 'erro') {
  aviso.textContent = texto;
  aviso.className = 'aviso ' + tipo;
}

const { data: { session } } = await sb.auth.getSession();
if (session) location.replace(destino);

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const nome     = document.getElementById('nome').value.trim();
  const telefone = document.getElementById('telefone').value.trim();
  const email    = document.getElementById('email').value.trim();
  const senha    = document.getElementById('senha').value;

  if (!nome)            return mostrar('Informe seu nome.');
  if (!cpfValido(cpf.value)) return mostrar('CPF inválido. Confira os números.');
  if (!email)           return mostrar('Informe seu e-mail.');
  if (senha.length < 6) return mostrar('A senha precisa ter pelo menos 6 caracteres.');

  botao.disabled = true;
  botao.textContent = 'Criando...';

  // confere o CPF antes, para não criar login sem perfil
  const { data: disponivel, error: erroCpf } = await sb.rpc('cpf_disponivel', {
    p_cpf: soDigitos(cpf.value)
  });

  if (erroCpf || !disponivel?.ok) {
    mostrar(disponivel?.motivo || 'Não foi possível conferir o CPF.');
    botao.disabled = false;
    botao.textContent = 'Criar minha conta';
    return;
  }

  // nome, telefone e CPF vão no metadata; o gatilho do banco cria o perfil com eles
  const { data, error } = await sb.auth.signUp({
    email,
    password: senha,
    options: { data: { nome, telefone, cpf: soDigitos(cpf.value) } }
  });

  if (error) {
    mostrar(traduzErro(error.message));
    botao.disabled = false;
    botao.textContent = 'Criar minha conta';
    return;
  }

  // Com a confirmação de e-mail desligada, a sessão já vem pronta.
  if (data.session) {
    location.href = destino;
  } else {
    mostrar('Conta criada. Confirme o e-mail que enviamos para entrar.', 'ok');
    botao.textContent = 'Conta criada';
  }
});

</script>

</body>
</html>
