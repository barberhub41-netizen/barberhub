<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entrar — BarberHub</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#d86b3f" />
<link rel="apple-touch-icon" href="icone-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="estilo.css" />
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <a class="logo" href="index.html">
      <span class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.1" y2="15.9"/><line x1="14.5" y1="14.5" x2="20" y2="20"/><line x1="8.1" y1="8.1" x2="12" y2="12"/></svg>
      </span>
      <span><b>Barber<i>Hub</i></b><small>Para todos os estilos</small></span>
    </a>
    <div class="top-cta">
      <a class="btn btn-solid btn-sm" href="criar-conta.html">Criar conta</a>
    </div>
  </div>
</header>

<main class="acesso">
  <div class="caixa" style="width:min(520px,calc(100% - 32px))">
    <h1>Entrar</h1>
    <p class="legenda">Acesse para ver e gerenciar seus agendamentos.</p>

    <div class="filtros" style="justify-content:center;margin-bottom:6px">
      <button class="filtro on" data-modo="email" type="button">E-mail</button>
      <button class="filtro" data-modo="cpf" type="button">CPF</button>
    </div>

    <form id="form-entrar" novalidate>
      <div class="campo" id="campo-email">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="email" placeholder="voce@email.com" />
      </div>

      <div class="campo" id="campo-cpf" style="display:none">
        <label for="cpf">CPF</label>
        <input id="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00" />
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" placeholder="Sua senha" required />
      </div>
      <p style="text-align:right;margin-top:10px"><a href="recuperar.html" style="color:var(--orange);font-size:14px">Esqueci minha senha</a></p>
      <button class="btn btn-solid" type="submit" id="botao">Entrar</button>
    </form>

    <div class="aviso" id="aviso" role="status"></div>


    <div class="divisor">não tem conta?</div>

    <div class="escolhas">
      <a class="caminho" href="cadastro.html" style="padding:15px">
        <span class="caminho-icone" style="width:40px;height:40px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
        </span>
        <span class="caminho-texto"><b>Criar conta de cliente</b>
        <small>Para marcar horário</small></span>
        <span class="caminho-seta">→</span>
      </a>

      <a class="caminho" href="cadastro-estabelecimento.html" style="padding:15px">
        <span class="caminho-icone" style="width:40px;height:40px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.1" y2="15.9"/><line x1="14.5" y1="14.5" x2="20" y2="20"/><line x1="8.1" y1="8.1" x2="12" y2="12"/></svg>
        </span>
        <span class="caminho-texto"><b>Cadastrar barbearia</b>
        <small>Para receber agendamentos</small></span>
        <span class="caminho-seta">→</span>
      </a>
    </div>

    <a class="voltar" href="index.html">← Voltar para o início</a>
  </div>
</main>

<script type="module">
import { sb, mascaraCpf, cpfValido, soDigitos } from './app.js';
import { traduzErro, SUPABASE_URL, SUPABASE_ANON_KEY } from './config.js';

const destino = new URLSearchParams(location.search).get('voltar') || 'meus-agendamentos.html';
const form   = document.getElementById('form-entrar');
const aviso  = document.getElementById('aviso');
const botao  = document.getElementById('botao');
const cpf    = document.getElementById('cpf');
let modo = 'email';

mascaraCpf(cpf);

document.querySelector('.filtros').addEventListener('click', (e) => {
  const botao = e.target.closest('[data-modo]');
  if (!botao) return;
  document.querySelectorAll('.filtro').forEach(f => f.classList.remove('on'));
  botao.classList.add('on');
  modo = botao.dataset.modo;
  document.getElementById('campo-email').style.display = modo === 'email' ? '' : 'none';
  document.getElementById('campo-cpf').style.display = modo === 'cpf' ? '' : 'none';
  aviso.textContent = '';
  aviso.className = 'aviso';
});

function mostrar(texto, tipo = 'erro') {
  aviso.textContent = texto;
  aviso.className = 'aviso ' + tipo;
}

// Já está logado? Vai direto para os agendamentos.
const { data: { session } } = await sb.auth.getSession();
if (session) location.replace(destino);

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const senha = document.getElementById('senha').value;

  if (!senha) return mostrar('Informe a senha.');

  botao.disabled = true;
  botao.textContent = 'Entrando...';

  const soltar = (mensagem) => {
    mostrar(mensagem);
    botao.disabled = false;
    botao.textContent = 'Entrar';
  };

  // ------------------------------------------------------------
  // Por CPF: quem descobre o e-mail é a Edge Function, não o site
  // ------------------------------------------------------------
  if (modo === 'cpf') {
    if (!cpfValido(cpf.value)) return soltar('CPF inválido. Confira os números.');

    try {
      const resposta = await fetch(SUPABASE_URL + '/functions/v1/entrar-cpf', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
        },
        body: JSON.stringify({ cpf: soDigitos(cpf.value), senha })
      });

      const r = await resposta.json().catch(() => ({}));

      if (!resposta.ok || !r.ok) return soltar(r.erro || 'CPF ou senha incorretos.');

      const { error } = await sb.auth.setSession({
        access_token: r.access_token,
        refresh_token: r.refresh_token
      });

      if (error) return soltar(traduzErro(error.message));

      location.href = destino;
      return;

    } catch (erro) {
      return soltar('Não foi possível falar com o servidor. Tente pelo e-mail.');
    }
  }

  // ------------------------------------------------------------
  // Por e-mail
  // ------------------------------------------------------------
  const email = document.getElementById('email').value.trim();
  if (!email) return soltar('Informe o e-mail.');

  const { error } = await sb.auth.signInWithPassword({ email, password: senha });

  if (error) return soltar(traduzErro(error.message));

  location.href = destino;
});

</script>

</body>
</html>
