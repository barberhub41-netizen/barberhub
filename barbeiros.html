<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Equipe — BarberHub</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#d86b3f" />
<link rel="apple-touch-icon" href="icone-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="estilo.css" />
</head>
<body>

<header class="top" id="topo"></header>

<main class="pagina">
  <div class="wrap">
    <h1>Equipe</h1>
    <p class="legenda">Quem atende na sua barbearia. Cada profissional terá a própria agenda.</p>
    <div id="menu"></div>
    <div id="conteudo"><p class="carregando">Carregando...</p></div>
  </div>
</main>

<div class="janela" id="janela-acesso" hidden>
  <div class="janela-caixa">
    <button class="fechar" id="a-fechar" aria-label="Fechar">×</button>
    <h2>Criar acesso</h2>
    <p class="legenda" id="a-quem"></p>

    <div class="campo">
      <label for="a-email">E-mail do profissional</label>
      <input id="a-email" type="email" placeholder="jose@email.com" autocomplete="off" />
      <p class="dica">É com ele que a pessoa vai entrar.</p>
    </div>

    <div class="campo">
      <label for="a-senha">Senha</label>
      <input id="a-senha" type="text" placeholder="Mínimo de 6 caracteres" autocomplete="off" />
      <p class="dica">Combine com o profissional e peça para ele trocar depois.</p>
    </div>

    <div class="aviso" id="a-aviso" role="status"></div>

    <div class="acoes">
      <button class="btn btn-solid" id="a-criar">Criar acesso</button>
      <button class="btn btn-outline" id="a-cancelar">Cancelar</button>
    </div>
  </div>
</div>

<template id="modelo">
  <div class="painel" style="max-width:860px">
    <form id="novo">
      <div class="linha-form" style="grid-template-columns:2fr 1fr 1fr auto">
        <div class="campo">
          <label for="nome">Nome do profissional</label>
          <input id="nome" type="text" placeholder="José da Silva" required />
        </div>
        <div class="campo">
          <label for="comissao">Comissão serviços (%)</label>
          <input id="comissao" type="number" min="0" max="100" step="1" value="0" />
        </div>
        <div class="campo">
          <label for="comissao-prod">Comissão produtos (%)</label>
          <input id="comissao-prod" type="number" min="0" max="100" step="1" value="0" />
        </div>
        <button class="btn btn-solid" type="submit" id="adicionar">Adicionar</button>
      </div>
      <div class="aviso" id="aviso" role="status"></div>
    </form>
  </div>
  <div id="lista" style="margin-top:28px"></div>
</template>

<script type="module">
import { sb, montarTopo, exigirLogin, montarPainel, escapar } from './app.js';
import { SUPABASE_URL } from './config.js';

const sessao = await exigirLogin();
montarTopo('estabelecimento');
const barbearia = await montarPainel('barbeiros.html');

const conteudo = document.getElementById('conteudo');

if (!barbearia) {
  conteudo.innerHTML = '<div class="vazio">' +
    '<b>Cadastre a barbearia primeiro</b>' +
    '<p>A equipe pertence a um estabelecimento. Preencha os dados antes.</p>' +
    '<a class="btn btn-solid" href="estabelecimento.html">Cadastrar barbearia</a></div>';
} else {
  conteudo.appendChild(document.getElementById('modelo').content.cloneNode(true));
  iniciar();
}

function iniciar() {
  const lista = document.getElementById('lista');
  const aviso = document.getElementById('aviso');
  const botao = document.getElementById('adicionar');

  const mostrar = (t, tipo = 'erro') => { aviso.textContent = t; aviso.className = 'aviso ' + tipo; };

  async function carregar() {
    const { data, error } = await sb
      .from('barbeiros')
      .select('id, nome, ativo, perfil_id, email, comissao_pct, comissao_produtos_pct')
      .eq('estabelecimento_id', barbearia.id)
      .order('nome');

    if (error) { lista.innerHTML = '<div class="vazio"><b>Erro ao carregar</b><p>' + escapar(error.message) + '</p></div>'; return; }

    if (!data.length) {
      lista.innerHTML = '<div class="vazio"><b>Nenhum profissional ainda</b>' +
        '<p>Cadastre pelo menos um. Se você atende sozinho, coloque o seu próprio nome.</p></div>';
      return;
    }

    lista.innerHTML = data.map(b =>
      '<div class="item' + (b.ativo ? '' : ' inativo') + '">' +
        '<div class="principal"><b>' + escapar(b.nome) + '</b>' +
        '<span>' + (b.ativo ? 'Recebendo agendamentos' : 'Fora da agenda') +
        ' · comissão ' + Number(b.comissao_pct) + '% em serviços, ' +
        Number(b.comissao_produtos_pct) + '% em produtos' +
        (b.perfil_id ? ' · acesso liberado' + (b.email ? ' (' + escapar(b.email) + ')' : '') : ' · sem acesso') +
        '</span></div>' +
        '<button class="btn btn-outline" data-comissao="' + b.id + '">Comissão</button>' +
        (b.perfil_id
          ? '<button class="btn btn-outline" data-tirar="' + b.id + '">Tirar acesso</button>'
          : '<button class="btn btn-solid" data-acesso="' + b.id + '" data-nome="' + escapar(b.nome) + '">Criar acesso</button>') +
        '<button class="btn btn-outline" data-alternar="' + b.id + '" data-ativo="' + b.ativo + '">' +
          (b.ativo ? 'Afastar' : 'Reativar') + '</button>' +
        '<button class="btn btn-perigo" data-apagar="' + b.id + '">Excluir</button>' +
      '</div>'
    ).join('');
  }

  document.getElementById('novo').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nome = document.getElementById('nome').value.trim();
    if (!nome) return mostrar('Informe o nome do profissional.');

    botao.disabled = true;
    const { error } = await sb.from('barbeiros').insert({
      estabelecimento_id: barbearia.id, nome,
      comissao_pct: Number(document.getElementById('comissao').value) || 0,
      comissao_produtos_pct: Number(document.getElementById('comissao-prod').value) || 0
    });
    botao.disabled = false;

    if (error) return mostrar('Não foi possível salvar: ' + error.message);

    document.getElementById('novo').reset();
    mostrar('Profissional adicionado.', 'ok');
    carregar();
  });

  lista.addEventListener('click', async (e) => {
    const acesso = e.target.closest('[data-acesso]');
    if (acesso) {
      abrirAcesso(acesso.dataset.acesso, acesso.dataset.nome);
      return;
    }

    const tirar = e.target.closest('[data-tirar]');
    if (tirar) {
      if (!confirm('Tirar o acesso desse profissional? A conta dele continua existindo, ' +
                   'mas deixa de enxergar a agenda da barbearia.')) return;
      tirar.disabled = true;
      await sb.from('barbeiros').update({ perfil_id: null }).eq('id', tirar.dataset.tirar);
      carregar();
      return;
    }

    const comissao = e.target.closest('[data-comissao]');
    if (comissao) {
      const atual = await sb.from('barbeiros')
        .select('nome, comissao_pct, comissao_produtos_pct')
        .eq('id', comissao.dataset.comissao).single();

      const servicosPct = prompt(
        'Comissão de ' + atual.data.nome + ' em SERVIÇOS (%)',
        Number(atual.data.comissao_pct));
      if (servicosPct === null) return;

      const produtosPct = prompt(
        'Comissão de ' + atual.data.nome + ' em PRODUTOS (%)',
        Number(atual.data.comissao_produtos_pct));
      if (produtosPct === null) return;

      const a = Number(servicosPct), b = Number(produtosPct);
      if (!Number.isFinite(a) || a < 0 || a > 100 || !Number.isFinite(b) || b < 0 || b > 100) {
        alert('Use números de 0 a 100.');
        return;
      }

      await sb.from('barbeiros')
        .update({ comissao_pct: a, comissao_produtos_pct: b })
        .eq('id', comissao.dataset.comissao);
      carregar();
      return;
    }

    const alternar = e.target.closest('[data-alternar]');
    const apagar   = e.target.closest('[data-apagar]');

    if (alternar) {
      const ativo = alternar.dataset.ativo === 'true';
      alternar.disabled = true;
      await sb.from('barbeiros').update({ ativo: !ativo }).eq('id', alternar.dataset.alternar);
      carregar();
      return;
    }

    if (apagar) {
      if (!confirm('Excluir esse profissional? Se ele já tiver agendamentos, o banco não vai permitir — nesse caso use Afastar.')) return;
      apagar.disabled = true;
      const { error } = await sb.from('barbeiros').delete().eq('id', apagar.dataset.apagar);
      if (error) {
        alert('Não foi possível excluir. Provavelmente já existe agendamento com esse profissional. Use Afastar.');
        apagar.disabled = false;
        return;
      }
      carregar();
    }
  });

  // ----------------------------------------------------------
  // Criar acesso do profissional
  // ----------------------------------------------------------
  const janela = document.getElementById('janela-acesso');
  const aAviso = document.getElementById('a-aviso');
  let alvoAcesso = null;

  function abrirAcesso(id, nome) {
    alvoAcesso = id;
    document.getElementById('a-quem').textContent =
      'O login é de ' + nome + '. Ele vai enxergar só a agenda dele.';
    document.getElementById('a-email').value = '';
    document.getElementById('a-senha').value = '';
    aAviso.className = 'aviso';
    janela.hidden = false;
  }

  const fecharAcesso = () => { janela.hidden = true; alvoAcesso = null; };
  document.getElementById('a-fechar').addEventListener('click', fecharAcesso);
  document.getElementById('a-cancelar').addEventListener('click', fecharAcesso);
  janela.addEventListener('click', (e) => { if (e.target === janela) fecharAcesso(); });

  document.getElementById('a-criar').addEventListener('click', async () => {
    if (!alvoAcesso) return;

    const email = document.getElementById('a-email').value.trim();
    const senha = document.getElementById('a-senha').value;
    const botao = document.getElementById('a-criar');

    const falhar = (t) => { aAviso.textContent = t; aAviso.className = 'aviso erro';
                            botao.disabled = false; botao.textContent = 'Criar acesso'; };

    if (!email.includes('@')) return falhar('Informe um e-mail válido.');
    if (senha && senha.length < 6) return falhar('A senha precisa ter pelo menos 6 caracteres.');

    botao.disabled = true;
    botao.textContent = 'Criando...';

    let resposta, r;
    try {
      const { data: { session } } = await sb.auth.getSession();
      resposta = await fetch(SUPABASE_URL + '/functions/v1/criar-barbeiro', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + session.access_token
        },
        body: JSON.stringify({
          barbeiro_id: alvoAcesso,
          email,
          senha: senha || undefined,
          nome: document.getElementById('a-quem').textContent
        })
      });
      r = await resposta.json().catch(() => ({}));
    } catch (erro) {
      return falhar('Não foi possível falar com o servidor. ' +
                    'A função criar-barbeiro já foi publicada no Supabase?');
    }

    if (resposta.status === 404) {
      return falhar('A função criar-barbeiro não está publicada no Supabase.');
    }

    if (!resposta.ok || r.erro) {
      return falhar(r.erro || ('Erro ' + resposta.status));
    }

    botao.disabled = false;
    botao.textContent = 'Criar acesso';
    fecharAcesso();

    if (r.ja_tinha_conta) {
      alert('Essa pessoa já tinha conta no BarberHub. O acesso foi ligado ao perfil dela — ' +
            'ela entra com a senha que já usa.');
    } else {
      alert('Acesso criado.\n\n' +
            'E-mail: ' + r.email + '\n' +
            'Senha: ' + r.senha + '\n\n' +
            (r.definida_por_voce ? '' : 'Anote: esta senha não aparece de novo.\n') +
            'Peça para a pessoa trocar no primeiro acesso.');
    }

    carregar();
  });

  carregar();
}
</script>

</body>
</html>
